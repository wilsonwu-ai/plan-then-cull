<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="exchange-rate-title exchange-rate-desc">
  <title id="exchange-rate-title">Candidate throughput falls faster than model size rises</title>
  <desc id="exchange-rate-desc">Bar chart measured on an Apple M4 Max with 128 GB unified memory running Ollama 0.31.1. A 0.6B model produces 62 candidate generations in a 30-second round, a 1.7B model produces 29, and an 8B model produces 8. Thirteen times the parameters costs roughly eight times the candidate width.</desc>

  <rect width="1000" height="560" fill="#f5f5f5"/>

  <!-- gridlines -->
  <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
  <line x1="80" y1="325" x2="960" y2="325" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <line x1="80" y1="230" x2="960" y2="230" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <line x1="80" y1="135" x2="960" y2="135" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <line x1="80" y1="40"  x2="960" y2="40"  stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <line x1="80" y1="40"  x2="80"  y2="420" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>

  <!-- y axis labels -->
  <text x="72" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="end">0</text>
  <text x="72" y="329" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="end">20</text>
  <text x="72" y="234" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="end">40</text>
  <text x="72" y="139" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="end">60</text>
  <text x="72" y="44"  fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="end">80</text>
  <text x="24" y="230" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.14em" text-anchor="middle" transform="rotate(-90 24 230)">CANDIDATES PER 30s ROUND</text>

  <!-- bar 1: qwen3:0.6b — focal -->
  <rect x="140" y="126" width="160" height="294" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
  <text x="220" y="118" fill="#eb6c36" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">62</text>
  <text x="220" y="444" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">qwen3:0.6b</text>
  <text x="220" y="460" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">332 tok/s</text>

  <!-- bar 2: qwen3:1.7b -->
  <rect x="420" y="282" width="160" height="138" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <text x="500" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">29</text>
  <text x="500" y="444" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">qwen3:1.7b</text>
  <text x="500" y="460" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">153 tok/s</text>

  <!-- bar 3: qwen3:8b -->
  <rect x="700" y="382" width="160" height="38" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <text x="780" y="374" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">8</text>
  <text x="780" y="444" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">qwen3:8b</text>
  <text x="780" y="460" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">42 tok/s</text>

  <!-- legend strip -->
  <line x1="30" y1="492" x2="970" y2="492" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="30" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.14em">MEASURED</text>
  <text x="140" y="512" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace">Apple M4 Max · 128 GB · ollama 0.31.1 · OLLAMA_NUM_PARALLEL=8 · 160 tok/candidate · temp 0.8</text>
  <text x="30" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.14em">READS AS</text>
  <text x="140" y="532" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace">13x the parameters buys 8x fewer candidates — and width is where the method's gain comes from</text>
</svg>
