<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" width="1080" height="480" role="img" aria-labelledby="mechanism-title mechanism-desc">
  <title id="mechanism-title">Plan then cull: a planner writes a checkable program, small models fill it in</title>
  <desc id="mechanism-desc">Flow diagram. A task with a hard constraint goes to a planner model, which writes a checkable program once. A small follower model then generates many candidate answers in parallel. A Python interpreter runs the program against each candidate and returns a real pass or fail verdict. Failures are culled and survivors are resampled for another round; the loop repeats until a candidate satisfies the constraint. The interpreter, highlighted, replaces the model-written approximate checker used in the original paper.</desc>

  <defs>
    <marker id="mech-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="mech-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <rect width="1080" height="480" fill="#f5f5f5"/>

  <!-- ============ connectors (drawn before boxes) ============ -->
  <!-- task -> planner -->
  <line x1="184" y1="120" x2="252" y2="120" stroke="#4f5d75" stroke-width="1" marker-end="url(#mech-arrow)"/>
  <!-- planner -> program -->
  <line x1="412" y1="120" x2="480" y2="120" stroke="#4f5d75" stroke-width="1" marker-end="url(#mech-arrow)"/>
  <!-- program -> follower : right, then down into the follower's TOP edge -->
  <path d="M 640 120 H 712 Q 720 120 720 128 V 264" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#mech-arrow)"/>
  <!-- task -> follower : down then right into the LEFT edge (the constraint also reaches the generator) -->
  <path d="M 120 152 V 292 Q 120 300 128 300 H 628" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#mech-arrow)"/>
  <!-- follower -> interpreter (accent, into focal) -->
  <path d="M 808 300 H 872 Q 880 300 880 308 V 344" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#mech-arrow-accent)"/>
  <!-- interpreter -> cull/resample (accent, out of focal) -->
  <path d="M 800 388 H 532" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#mech-arrow-accent)"/>
  <!-- resample -> follower : own corridor at y=348, entering the BOTTOM edge.
       Deliberately not y=300; that lane already carries the dashed constraint arrow. -->
  <path d="M 400 388 H 352 Q 344 388 344 380 V 356 Q 344 348 352 348 H 736 Q 744 348 744 340 V 336" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#mech-arrow)"/>
  <!-- interpreter -> answer -->
  <path d="M 960 368 H 1000 Q 1008 368 1008 360 V 156" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#mech-arrow)"/>

  <!-- arrow labels: opaque mask + 8px gap above the stroke, on open canvas only -->
  <rect x="440" y="328" width="84" height="12" rx="2" fill="#f5f5f5"/>
  <text x="482" y="337" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">RESAMPLE</text>

  <rect x="618" y="368" width="96" height="12" rx="2" fill="#f5f5f5"/>
  <text x="666" y="377" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">CULL FAILURES</text>

  <!-- ============ nodes ============ -->
  <!-- task -->
  <rect x="56" y="88" width="128" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="56" y="88" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <rect x="64" y="94" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
  <text x="80" y="103" fill="rgba(122,131,153,0.9)" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="120" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, sans-serif" text-anchor="middle">Task</text>
  <text x="120" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">+ hard constraint</text>

  <!-- planner -->
  <rect x="252" y="88" width="160" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="252" y="88" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="260" y="94" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="280" y="103" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">PLANNER</text>
  <text x="332" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, sans-serif" text-anchor="middle">Writes the check</text>
  <text x="332" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">qwen3:8b · 1 call</text>

  <!-- program -->
  <rect x="480" y="88" width="160" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="480" y="88" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="488" y="94" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
  <text x="508" y="103" fill="rgba(79,93,117,0.9)" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">ARTIFACT</text>
  <text x="560" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, sans-serif" text-anchor="middle">check(text) -&gt; bool</text>
  <text x="560" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">plain python</text>

  <!-- follower population -->
  <rect x="632" y="268" width="176" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="632" y="268" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="640" y="274" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="662" y="283" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">FOLLOWER</text>
  <text x="720" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, sans-serif" text-anchor="middle">N candidates</text>
  <text x="720" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">qwen3:0.6b · temp 0.8</text>

  <!-- interpreter (FOCAL) -->
  <rect x="800" y="348" width="160" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="800" y="348" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <rect x="808" y="354" width="48" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
  <text x="832" y="363" fill="#eb6c36" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">VERIFIER</text>
  <text x="880" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, sans-serif" text-anchor="middle">Python interpreter</text>
  <text x="880" y="400" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">runs it · no opinion</text>

  <!-- cull / resample -->
  <rect x="400" y="356" width="128" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="400" y="356" width="128" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="408" y="362" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
  <text x="426" y="371" fill="rgba(79,93,117,0.9)" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">ROUND</text>
  <text x="464" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, sans-serif" text-anchor="middle">Keep survivors</text>
  <text x="464" y="408" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">drop the rest</text>

  <!-- answer -->
  <rect x="944" y="88" width="128" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="944" y="88" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <rect x="952" y="94" width="40" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
  <text x="972" y="103" fill="rgba(122,131,153,0.9)" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">OUTPUT</text>
  <text x="1008" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, sans-serif" text-anchor="middle">Answer</text>
  <text x="1008" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">provably passes</text>

  <!-- legend strip -->
  <line x1="30" y1="440" x2="1050" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="30" y="460" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="128" y="452" width="10" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="146" y="461" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace">our change — the paper checks with a model here</text>
  <line x1="560" y1="457" x2="596" y2="457" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="604" y="461" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace">constraint travels to the generator too</text>
  <text x="880" y="461" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace">loop repeats until pass</text>
</svg>
